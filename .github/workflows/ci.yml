name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # No secrets are available here and pytest-socket blocks the network:
      # the suite must pass on the fake model alone.
      - run: uv run pytest --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: junit.xml

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # Fails if openapi.json no longer matches the API the code serves.
      - run: uv run python -m app.export_openapi --check

  docker:
    runs-on: ubuntu-latest
    env:
      MC_LLM: fake  # CI has no Foundry credentials, by design
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - run: docker compose build app test
      - name: README test command
        run: docker compose run --rm test
      - name: README start command, smoke test and restart persistence
        run: |
          docker compose up -d --wait app
          ./scripts/smoke.sh
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v
